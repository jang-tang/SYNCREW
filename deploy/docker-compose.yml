# SYNCREW 운영 배포 (AWS 시드니 EC2, 2026-10-20–31). 절차: deploy/README.md
#   caddy  : 80/443 → TLS(Let's Encrypt) → server:4000
#   server : SYNCREW API + Socket.IO(/rt). 4000 은 외부에 열지 않는다 (compose 내부망만)
#   denoise: 노이즈 필터 사이드카 자리 (profiles: denoise 일 때만 실행, 규격 docs/denoise-sidecar.md)
# .env 는 deploy/render-env.sh 가 SSM Parameter Store 에서 만든다 (git 제외).
name: syncrew

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # 발급받은 인증서 (지우면 재발급 → Let's Encrypt 발급 횟수 제한 주의)
      - caddy_config:/config
    depends_on:
      - server
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  server:
    build:
      context: ../server
    image: syncrew-server:latest
    env_file: .env
    volumes:
      - server_data:/data       # STORAGE_DIR=/data (업로드·번역 음성)
    expose:
      - "4000"
    restart: unless-stopped
    init: true                  # 종료 신호 전달 (서버가 진행 중 통역을 최대 5초 기다린 뒤 종료)
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  # 노이즈 필터 사이드카 (GTCRN, ../denoise). `docker compose --profile denoise up -d --build` 일 때만 뜬다.
  # 서버 쪽 연결 코드('sidecar' 필터)는 별도 PR. 규격: docs/denoise-sidecar.md (ws://denoise:8765)
  denoise:
    profiles: ["denoise"]
    build:
      context: ../denoise
    image: syncrew-denoise:latest
    environment:
      DENOISE_DRY_MIX: ${DENOISE_DRY_MIX:-0}   # 원본 섞는 비율 0~1 (과억제로 받아쓰기가 나빠지면 올린다)
    restart: unless-stopped
    expose:
      - "8765"
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  server_data:
